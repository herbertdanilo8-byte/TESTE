<title>Segunda Mente</title><style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--c:#fff;--t:#1e2433;--m:#6b7280;--p:#4f46e5;--g:#059669;--r:#dc2626;--b:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--c:#181c2e;--t:#e8eaf3;--m:#9aa3b8;--b:#2a3047}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
#side{width:240px;background:var(--c);border-right:1px solid var(--b);padding:16px;position:sticky;top:0;height:100vh}
.logo{font-size:18px;margin-bottom:20px}nav{display:flex;flex-direction:column;gap:4px}nav button,.fut{padding:10px;border-radius:8px;text-align:left;border:0;background:none;color:inherit;font:inherit}
nav .on{background:var(--p);color:#fff}.fut{opacity:.5;cursor:default}.fut i{font-size:10px;border:1px solid var(--m);border-radius:9px;padding:0 6px;margin-left:4px}
#wrap{flex:1;min-width:0}header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--b);gap:8px}#menuBtn{display:none}
main{padding:24px;max-width:1100px;margin:auto}.muted,small{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0}.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card,.kpi{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;animation:in .25s}.kpi b{display:block;font-size:22px;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}.big{font-size:24px;display:block;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--b);background:var(--c);color:inherit;border-radius:8px;padding:7px 12px;font:inherit}button.pri{background:var(--p);color:#fff;border-color:var(--p)}button.in{color:var(--g)}button.out{color:var(--r)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:inherit;font:inherit}label{display:block;font-size:13px;color:var(--m);margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{width:auto}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b);margin:16px 0;overflow:auto}.tabs button{border:0;border-radius:0;background:none}.tabs .on{border-bottom:2px solid var(--p);color:var(--p)}
table{width:100%;border-collapse:collapse;background:var(--c)}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}.wrap{overflow-x:auto}td.in,.pos{color:var(--g)}td.out,.neg{color:var(--r)}
dialog{border:0;border-radius:14px;padding:20px;max-width:560px;width:94%;background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu summary{cursor:pointer;list-style:none}.menu{position:relative}.menu[open] button{display:block;position:relative;z-index:2;width:100%}
.chart{display:flex;gap:10px;align-items:flex-end;height:120px}.chart div{flex:1;text-align:center;font-size:11px}.chart span{display:inline-block;width:40%;margin:0 1px;border-radius:3px 3px 0 0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--g);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s}#toast.show{opacity:1}#toast.err{background:var(--r)}
@media(max-width:800px){#side{position:fixed;left:-250px;z-index:5;transition:.2s}#side.open{left:0;box-shadow:0 0 40px #0007}#menuBtn{display:block}.two{grid-template-columns:1fr}}

.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;object-fit:cover;flex:none}.who{display:flex;align-items:center;gap:12px}.who h3,.who h1{margin:0}

.meter{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:10px 0 4px}.meter i{display:block;height:100%;background:var(--p)}.al{padding:8px 12px;border-radius:8px;margin:6px 0}.al.warn{background:#fef3c7;color:#92400e}.al.err{background:#fee2e2;color:#991b1b}.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.sub .on{background:var(--p);color:#fff}details.card summary{cursor:pointer}

  else{S.cardTx.push({id:nid(),...o});clog('Compra registrada',a.id,`${o.description} (${c}), ${n}x de ${brl(total/n)}, fatura ${mk(key)}`,total,'out')}
  toast('Compra salva.');return true}
 if(t==='pay'){const inv=C.invoices(a,C.cardData(S,a)).find(v=>v.key===d.key),bank=acc(d.bankId),amt=rnd(+d.amount),it=rnd(+d.interest||0),ds=rnd(+d.discount||0);

async function createSheet(){const dr=view.draft,names=dr.columns.map(c=>c.name.trim().toLowerCase()),old=view.editing&&S.sheets.find(x=>x.id===view.editing);
 if(!dr.name.trim())return toast('Dê um nome à planilha.',1);if(!dr.columns.length||names.some(n=>!n)||new Set(names).size!==names.length)return toast('Cada coluna precisa de um nome único.',1);
 const bad=dr.columns.find(c=>c.type==='select'&&!(c.options||[]).length);if(bad)return toast(`Informe as opções da coluna "${bad.name}".`,1);
 if(old)old.columns.forEach(o=>{const n=dr.columns.find(c=>c.id===o.id);if(n&&n.name!==o.name){dr.columns.forEach(k=>{if(k.formula)k.formula=SH.renameRefs(k.formula,o.name,n.name)});dr.kpis.forEach(k=>{if(k.col&&k.col.toLowerCase()===o.name.toLowerCase())k.col=n.name;(k.where||[]).forEach(w=>{if(w[0].toLowerCase()===o.name.toLowerCase())w[0]=n.name})})}});
 const err=SH.validate(dr.columns);if(err)return toast(err,1);const cols=dr.columns.map(c=>({...c,name:c.name.trim()}));
 if(old){const ids=new Set(cols.map(c=>c.id));old.rows.forEach(r=>{for(const k of Object.keys(r.values))if(!ids.has(k))delete r.values[k]});Object.assign(old,{name:dr.name.trim(),category:dr.category.trim(),description:dr.description.trim(),columns:cols,kpis:dr.kpis});touch(old);view={name:'sheet',id:old.id,per:'all',pc:{},f:{},sel:[]}}
 else{const sh={id:SH.uid(),name:dr.name.trim(),category:dr.category.trim()||'Geral',description:dr.description.trim(),favorite:false,columns:cols,kpis:dr.kpis,rows:[],createdAt:nowIso(),updatedAt:nowIso()};S.sheets.push(sh);view={name:'sheet',id:sh.id,per:'all',pc:{},f:{},sel:[]}}

 if(a==='ndup'){const c={...n,id:SH.uid(),title:(n.title||'Sem título')+' (cópia)',favorite:false,createdAt:nowIso(),updatedAt:nowIso()};S.notes.push(c);toast('Anotação duplicada.');render();return persist()}
 if(a==='narch'){n.archived=!n.archived;view={name:'sheets',tab:'notes'};render();toast(n.archived?'Anotação arquivada.':'Anotação restaurada.');return persist()}
 if(a==='ntxt')return download((n.title||'anotacao').replace(/[^\wÀ-ú\-]+/g,'_')+'.txt','text/plain;charset=utf-8','\ufeff'+(n.title?n.title+'\r\n\r\n':'')+n.content);
 if(a==='ndel'){if(!confirm('Excluir esta anotação definitivamente?'))return;S.notes=S.notes.filter(x=>x.id!==n.id);view={name:'sheets',tab:'notes'};render();toast('Anotação excluída.');return persist()}
 if(a==='n2s'){clearTimeout(nt);await persist();const rows=SH.parseNote(n.content);if(!rows.length)return toast('Não encontrei compras ou vendas no texto. Exemplo: "Comprei 20 pomadas por R$ 15 cada e vendi 5 por R$ 30 cada."',1);return go({name:'notepre',prev:rows,noteId:n.id})}
 if(a==='npback')return go({name:'sheets',tab:'notes',note:view.noteId});
 if(a==='npcreate'){if(view.prev.some(r=>!String(r.produto).trim()))return toast('Informe o nome do produto em todas as linhas.',1);const dr=SH.tpl('estoque'),cid=k=>dr.columns.find(c=>c.name===k).id;
  const sh={id:SH.uid(),name:'Controle de produtos (da anotação)',category:dr.category,description:'Criada a partir de uma anotação, após conferência.',favorite:false,columns:dr.columns,kpis:dr.kpis,createdAt:nowIso(),updatedAt:nowIso(),
   rows:view.prev.map(r=>({id:SH.uid(),values:{[cid('Data')]:F.today(),[cid('Produto')]:r.produto.trim(),[cid('Qtd comprada')]:r.qc,[cid('Custo unitário')]:r.cu,[cid('Qtd vendida')]:r.qv,[cid('Preço de venda')]:r.pv}}))};
  S.sheets.push(sh);view={name:'sheet',id:sh.id,per:'all',pc:{},f:{},sel:[]};render();return persist()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.sa)return;e.preventDefault();if(f.dataset.sa==='renform'){const sh=S.sheets.find(x=>x.id===f.dataset.id),nm=new FormData(f).get('name').trim();if(!nm)return toast('Informe um nome.',1);sh.name=nm;touch(sh);$('#dlg').close();render();await persist()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sq'){(view.f??={}).q=t.value;const sh=S.sheets.find(x=>x.id===view.id);if(sh)drawTable(sh)}
 else if(t.dataset.ne){const n=S.notes.find(x=>x.id===view.note);if(!n)return;n[t.dataset.ne]=t.value;n.updatedAt=nowIso();setSt('Salvando…');clearTimeout(nt);nt=setTimeout(persist,500)}});
document.addEventListener('change',async e=>{const t=e.target,D=t.dataset;
 if(t.id==='impf'&&t.files[0]){const fl=t.files[0];let o;try{o=JSON.parse(await fl.text())}catch(x){t.value='';return toast('Arquivo inválido: não é um JSON.',1)}t.value='';const r=G.validateBackup(o);if(r.error)return toast(r.error,1);
  if(!confirm(`Importar "${r.sheet.name}" com ${r.sheet.rows.length} registro(s) como NOVA planilha? Nenhuma planilha existente será alterada.`))return;S.sheets.push(r.sheet);render();toast('Backup importado.');return persist()}
 if(D.sf!==undefined){(view.sf??={})[D.sf]=t.value;return render()}
 if(D.nf!==undefined){(view.nf??={})[D.nf]=D.nf==='arch'?t.checked:t.value;return render()}
 if(D.sh==='per'){view.per=t.value;return render()}if(D.sh==='pfrom'||D.sh==='pto'){(view.pc??={})[D.sh==='pfrom'?'from':'to']=t.value;return render()}
 if(D.sh==='fcol'||D.sh==='fval'){(view.f??={})[D.sh==='fcol'?'col':'val']=t.value;return drawTable(S.sheets.find(x=>x.id===view.id))}
 if(D.cell!==undefined)return onCell(t);
 if(D.sel!==undefined){const s=view.sel??=[];if(t.checked)s.push(D.sel);else view.sel=s.filter(x=>x!==D.sel);return drawBulk()}
 if(D.dr){view.draft[D.dr]=t.value;return}
 if(D.dc){const c=view.draft.columns[+D.i],k=D.dc;c[k]=k==='required'?t.checked:k==='options'?t.value.split(',').map(x=>x.trim()).filter(Boolean):k==='width'?(+t.value||0):t.value;if(k==='type'){if(c.type==='formula'&&!c.fmt)c.fmt='qty';render()}return}
 if(D.dk){view.draft.kpis[+D.i].hidden=!t.checked;return}
 if(D.np){const r=view.prev[+D.i];r[D.np]=D.np==='produto'?t.value:(t.value===''?'':+t.value);return render()}});
// Menu do celular: fecha ao escolher uma opção ou ao tocar fora dele
document.addEventListener('click',e=>{const sd=$('#side');if(!sd||!sd.classList.contains('open')||e.target.closest('#menuBtn'))return;sd.classList.remove('open')});
async function boot(){
 try{S=await store.load(UID)}catch(e){console.error(e);if(store.locked!==undefined)store.locked=true;
  $('#main').innerHTML='<div class="card"><h3>Não foi possível carregar seus dados</h3><p class="muted">Verifique a internet. Nada foi alterado na nuvem.</p><button class="pri" onclick="location.reload()">Tentar de novo</button></div>';return}
 for(const k of ['cardTx','cardCredits','cardPays','cardLimits','log','sheets','notes'])S[k]??=[];S.cardCats??=[...CARDCATS];view={name:'home'};render()}
const AUTHERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/email-already-in-use':'Este e-mail já tem conta. Use "Entrar".','auth/weak-password':'Senha fraca: use pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem conexão com a internet.','auth/operation-not-allowed':'Ative "E-mail/senha" em Authentication no Firebase.'};
if(FB){
 const L=$('#login'),err=m=>$('#lerr').textContent=m||'',cred=()=>[$('#lmail').value.trim(),$('#lpass').value];
 const run=async f=>{err();try{await f()}catch(e){err(AUTHERR[e.code]||'Erro: '+(e.code||e.message))}};
 $('#lin').onclick=()=>run(()=>fauth.signInWithEmailAndPassword(...cred()));
 $('#lnew').onclick=()=>run(()=>fauth.createUserWithEmailAndPassword(...cred()));
 $('#lpass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lin').click()});
 $('#lreset').onclick=e=>{e.preventDefault();const m=$('#lmail').value.trim();if(!m)return err('Digite seu e-mail acima.');run(async()=>{await fauth.sendPasswordResetEmail(m);toast('Enviamos um link para redefinir a senha.')})};
 $('#logoutBtn').hidden=false;
 $('#logoutBtn').onclick=async()=>{try{localStorage.removeItem(K(UID))}catch(e){}await fauth.signOut()};
 fauth.onAuthStateChanged(async u=>{
  if(!u){S=null;$('#lpass').value='';L.hidden=false;return}
  UID=u.uid;store.locked=false;L.hidden=true;await boot()});
}else await boot();
